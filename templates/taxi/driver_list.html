{% extends "base.html" %}

{% block content %}
  <h2>Driver List</h2>
  <table>
    <tr>
      <th>Username</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Actions</th>
    </tr>
    {% for driver in object_list %}
      <tr>
        <td>{{ driver.username }}</td>
        <td>{{ driver.first_name }}</td>
        <td>{{ driver.last_name }}</td>
        <td><a href="{% url 'taxi:driver-detail' driver.pk %}">View Detail</a></td>
      </tr>
    {% endfor %}
  </table>

  {% include "includes/pagination.html" %}
{% endblock %}
