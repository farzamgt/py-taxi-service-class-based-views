{% extends "base.html" %}

{% block content %}
  <h2>Driver Detail: {{ driver.username }}</h2>

  <h3>First Name:</h3>
  <p>{{ driver.first_name }}</p>

  <h3>Last Name:</h3>
  <p>{{ driver.last_name }}</p>

  <h3>Cars:</h3>
  <ul>
    {% for car in driver.cars.all %}
      <li>{{ car.name }} - <a href="{% url 'taxi:car_detail' car.pk %}">View Car Detail</a></li>
    {% endfor %}
  </ul>

{% endblock %}
