{% extends "base.html" %}

{% block content %}
  <h2>Car List</h2>
  <table>
    <tr>
      <th>Car Name</th>
      <th>Manufacturer</th>
      <th>Actions</th>
    </tr>
    {% for car in object_list %}
      <tr>
        <td>{{ car.name }}</td>
        <td>{{ car.manufacturer.name }}</td>
        <td><a href="{% url 'taxi:car_detail' car.pk %}">View Detail</a></td>
      </tr>
    {% endfor %}
  </table>

  {% include "includes/pagination.html" %}
{% endblock %}
